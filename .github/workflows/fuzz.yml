name: fuzz

# PLAN M3: fuzz report.Normalize for 10 minutes every night (CI runs a 30 s smoke test).
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: fuzz Normalize
        run: go test -run='^$' -fuzz=FuzzNormalize -fuzztime=10m ./internal/report
