# GoReleaser v2. Local dry run: goreleaser release --snapshot --clean
# Signing is added in M8.
version: 2

project_name: machine-monitor

builds:
  - id: machine-monitor
    main: ./cmd/machine-monitor
    binary: machine-monitor
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: machine-monitor
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github
  sort: asc
